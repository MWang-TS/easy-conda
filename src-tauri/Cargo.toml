[package]
name = "easy-conda"
version = "0.1.0"
description = "A desktop manager for Conda environments"
authors = ["Easy Conda"]
edition = "2021"

[lib]
name = "easy_conda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
